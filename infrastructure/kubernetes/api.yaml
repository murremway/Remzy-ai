apiVersion: apps/v1
kind: Deployment
metadata:
  name: remzyforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remzyforge-api
  template:
    metadata:
      labels:
        app: remzyforge-api
    spec:
      containers:
        - name: api
          image: remzyforge/api:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remzyforge
                  key: database_url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: remzyforge
                  key: secret_key
---
apiVersion: v1
kind: Service
metadata:
  name: remzyforge-api
spec:
  selector:
    app: remzyforge-api
  ports:
    - port: 80
      targetPort: 8000
